# 개발용 Docker Compose (ADR 0056).
#
# 1. bootRun 이 MySQL 을 쓰게 하기: .env 에 QUICKTTS_DEV_MYSQL=true 를 넣고 평소처럼 bootRun 한다.
#    스프링 부트가 이 파일의 mysql 을 띄우고 DB 주소, 사용자, 비밀번호를 알아서 넣는다. 끌 때 mysql 도 멈춘다(데이터는 남음).
# 2. 봇 서버 이미지까지 같이 띄우기: docker compose --profile app up --build
#    배포와 같은 모양(봇 서버 + synthesis 서비스 + MySQL 컨테이너)을 이 PC 에서 돌려 본다. bootRun 과 같은 토큰으로 동시에 켜지 않는다.
#    PC 의 8080 을 다른 프로그램이 쓰고 있으면 .env 에 QUICKTTS_HOST_PORT=8090 처럼 비어 있는 번호를 넣는다.
# 3. 이 PC 의 봇 서버를 인터넷 주소로 열기: docker compose --profile app --profile tunnel up --build (ADR 0067)
#    주소는 docker compose --profile app --profile tunnel logs cloudflared 에 나오는 https://<무작위>.trycloudflare.com 이다. 켤 때마다 바뀐다.
#
# 비밀번호는 이 PC 안에서만 쓰는 개발용 값이다. 배포 서버에서는 이 파일을 쓰지 않는다.

services:
  mysql:
    image: mysql:26.7
    environment:
      MYSQL_DATABASE: quicktts
      MYSQL_USER: quicktts
      MYSQL_PASSWORD: quicktts-dev
      MYSQL_ROOT_PASSWORD: quicktts-dev-root
    ports:
      # bootRun 은 스프링 부트가 정해진 포트를 찾아 붙으므로 PC 쪽 포트는 비어 있는 아무 번호나 쓴다.
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uquicktts", "-pquicktts-dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot-server:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/bot-server/Dockerfile
    image: quicktts-bot-server
    env_file:
      - path: .env
        required: false
    environment:
      QUICKTTS_DB_URL: jdbc:mysql://mysql:3306/quicktts?connectionTimeZone=UTC
      QUICKTTS_DB_USERNAME: quicktts
      QUICKTTS_DB_PASSWORD: quicktts-dev
      # 컨테이너 안에서는 이 파일로 MySQL 을 다시 띄우지 않는다.
      QUICKTTS_DEV_MYSQL: "false"
      # 음성은 synthesis 서비스가 만든다.
      QUICKTTS_SYNTHESIS_URL: http://synthesis-service:8080
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-lgtm:4318/v1/traces
      # .env 에 bootRun 용 QUICKTTS_PORT 가 있어도 컨테이너 안에서는 8080 으로 연다(아래 ports 와 cloudflared 가 이 번호로 붙는다).
      QUICKTTS_PORT: "8080"
    ports:
      - "${QUICKTTS_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      synthesis-service:
        condition: service_started
    labels:
      # bootRun 이 이 파일을 읽을 때 봇 서버 컨테이너는 건너뛴다(같은 토큰으로 두 번 붙지 않게).
      org.springframework.boot.ignore: "true"

  synthesis-service:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/synthesis-service/Dockerfile
    image: quicktts-synthesis-service
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-lgtm:4318/v1/traces
    ports:
      # PC 에서 직접 불러 보려면 http://localhost:8082/internal/v1/voices
      - "8082:8080"
    labels:
      org.springframework.boot.ignore: "true"

  # 추적(Tempo)과 그래프(Grafana)를 한 컨테이너로. http://localhost:3000 (admin / admin) 의 Explore > Tempo 에서 quick chat 하나가
  # 봇 서버와 synthesis 서비스를 거친 길을 본다. 개발용이라 데이터는 남기지 않는다.
  otel-lgtm:
    profiles: [app]
    image: grafana/otel-lgtm:0.40.0
    ports:
      - "3000:3000"
    labels:
      org.springframework.boot.ignore: "true"

  # 봇 서버를 Cloudflare Tunnel 로 인터넷에 연다 (ADR 0067). 공유기 포트를 열지 않고 이 PC 에서 바깥으로만 연결한다.
  # 지금은 계정 없이 쓰는 quick tunnel 이라 주소가 켤 때마다 바뀐다. 고정 주소는 Cloudflare 계정과 도메인으로 만든다.
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.11.0
    command: tunnel --no-autoupdate --url http://bot-server:8080
    depends_on:
      - bot-server
    labels:
      org.springframework.boot.ignore: "true"

volumes:
  mysql-data:
