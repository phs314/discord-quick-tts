spring:
  application:
    name: quick-tts-bot
  config:
    # KEY=VALUE 설정 파일을 읽는다. 개발할 때는 저장소 루트의 .env, exe 로 띄울 때는 사용자 폴더의 server.env.
    # 둘 다 없으면 환경변수만 쓴다.
    import:
      - optional:file:.env[.properties]
      - optional:file:${user.home}/.discord-quick-tts/server.env[.properties]
  datasource:
    # 등록된 기기, 목소리 설정. 기본은 실행 위치의 data/ 폴더에 H2 파일로 저장한다.
    # 배포 서버는 MySQL 을 쓴다. 예: QUICKTTS_DB_URL=jdbc:mysql://localhost:3306/quicktts?connectionTimeZone=UTC
    # H2 는 MySQL 과 같은 SQL 이 돌도록 MySQL 호환 모드로 연다.
    url: ${QUICKTTS_DB_URL:jdbc:h2:file:./data/quicktts;MODE=MySQL}
    username: ${QUICKTTS_DB_USERNAME:sa}
    password: ${QUICKTTS_DB_PASSWORD:}
  flyway:
    # Flyway 전에 schema.sql 로 만든 DB 는 테이블이 이미 있으므로, 처음 한 번 V1 을 건너뛰고 그 위부터 쌓는다.
    baseline-on-migrate: true
  cache:
    # 같은 목소리, 같은 문장의 음성을 기억해 비공식 TTS 를 덜 부른다. mp3 한 개가 20KB 안팎이라 500개면 10MB 정도다.
    # 실패한 결과는 기억하지 않는다. 적중률은 /actuator/metrics/cache.gets 로 본다.
    cache-names: speech
    caffeine:
      spec: maximumSize=500,expireAfterAccess=1d,recordStats
  jpa:
    # 스키마는 Flyway 가 만들고, JPA 는 엔티티가 테이블과 맞는지만 켜질 때 확인한다.
    hibernate:
      ddl-auto: validate
    # 웹 요청이 끝날 때까지 DB 연결을 붙잡지 않는다. 지연 로딩할 연관 관계가 없다.
    open-in-view: false
    properties:
      # Instant 를 시간대 없는 datetime(6) 열에 JdbcClient 때와 같은 방식으로 넣고 읽는다.
      # 기본값(시간대 있는 timestamp)이면 H2 에서 열 타입이 맞지 않는다.
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP

server:
  port: ${QUICKTTS_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # 상태 확인(health)은 토큰 없이, 지표(metrics)는 기기 토큰이 있어야 본다. 다른 Actuator 주소는 열지 않는다.
        include: health, metrics

quicktts:
  discord:
    token: ${DISCORD_TOKEN:}
  tts:
    # 목소리를 고르지 않은 사용자에게 쓰는 목소리. 사람마다 디스코드 /목소리 명령으로 바꿀 수 있다.
    # 고를 수 있는 값: edge:ko-KR-SunHiNeural, edge:ko-KR-InJoonNeural, edge:ko-KR-HyunsuMultilingualNeural, google:ko
    default-voice: ${QUICKTTS_DEFAULT_VOICE:edge:ko-KR-SunHiNeural}
    # Edge 목소리 서버가 확인하는 Edge 브라우저 버전. Edge 목소리가 갑자기 안 되면 최신 버전으로 올린다.
    edge-chromium-version: 143.0.3650.75
  guild-allowlist:
    # 켜 두면 봇 주인이 /허용목록 으로 넣은 디스코드 서버에만 봇이 남고, 다른 곳에 초대되면 안내를 남기고 나간다.
    # 누구나 초대할 수 있게 공개할 때 false 로 바꾼다.
    enabled: ${QUICKTTS_GUILD_ALLOWLIST_ENABLED:true}
