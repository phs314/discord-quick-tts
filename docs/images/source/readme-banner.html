<!doctype html>
<!-- README 맨 위 배너 ../readme-banner.png 의 원본. 설치 마법사 dialog.bmp 왼쪽 보라 그림과 같은 모양을 가로로 펼쳤다.
     Chromium 에서 880x240 화면, 2배율, 배경 투명으로 캡처해 1760x480 PNG 로 덮어쓴다. --><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;font-family:Inter,"Noto Sans CJK KR",sans-serif;-webkit-font-smoothing:antialiased}
.panelbg{background:radial-gradient(120% 70% at 22% 18%,#6f63ff 0%,rgba(111,99,255,0) 60%),linear-gradient(165deg,#5b4ef0 0%,#4536d6 45%,#2e2391 100%)}
.wave{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.10)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 14px 6px 11px;border-radius:999px;background:rgba(0,0,0,.22);color:rgba(255,255,255,.88);font-size:13px;font-weight:600;white-space:nowrap}
.pill i{display:block;width:8px;height:8px;border-radius:50%;background:#23a55a;box-shadow:0 0 0 3px rgba(35,165,90,.25)}
.bar{display:flex;align-items:center;gap:12px;height:46px;padding:0 16px 0 9px;border-radius:10px;background:#383a40;box-shadow:0 10px 30px rgba(10,6,50,.45);color:#dbdee1;font-size:16px}
.bar .ch{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px 0 4px;border-radius:999px;background:#5865f2;color:#fff;font-weight:700;font-size:13px}
.bar .ch img{width:21px;height:21px;border-radius:50%;background:#fff}
.bar .txt{flex:1;white-space:nowrap}
.bar .caret{display:inline-block;width:2px;height:19px;background:#dbdee1;vertical-align:-3px;margin-left:2px}
.bar .hint{color:#80848e;font-size:12px;white-space:nowrap}

body{width:880px;height:240px;overflow:hidden;position:relative;background:transparent}
.wrap{position:absolute;inset:0;overflow:hidden}
.wrap::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 90% at 95% 110%,rgba(196,170,255,.35),rgba(196,170,255,0) 70%)}
.icon{position:absolute;left:52px;top:56px;width:128px;height:128px;border-radius:30px;box-shadow:0 12px 32px rgba(18,10,80,.55),0 0 0 1px rgba(255,255,255,.18);z-index:2}
.t{position:absolute;left:212px;top:58px;z-index:2;color:#fff}
.name{font-size:46px;font-weight:800;letter-spacing:-.8px;line-height:1}
.tag{margin-top:12px;font-size:17px;color:rgba(255,255,255,.78);font-weight:500}
.t .pill{margin-top:20px}
.demo{position:absolute;right:40px;top:92px;width:330px;z-index:2;transform:rotate(-2deg)}
.edge{position:absolute;left:0;bottom:0;width:880px;height:4px;background:linear-gradient(90deg,#8b7fff,#c9a8ff);z-index:3;border-radius:0 0 16px 16px}
</style></head><body><div class="wrap panelbg" style="border-radius:16px">
<div class="wave" style="width:420px;height:420px;left:-90px;top:-90px"></div>
<div class="wave" style="width:560px;height:560px;left:-160px;top:-160px"></div>
<div class="wave" style="width:700px;height:700px;left:-230px;top:-230px"></div>
<div class="wave" style="width:840px;height:840px;left:-300px;top:-300px"></div>
<img class="icon" src="../../../desktop-client/src/main/resources/io/github/phs314/quicktts/client/app-icon.png">
<div class="t"><div class="name">QuickTTS</div><div class="tag">단축키로 말하는 디스코드 TTS</div><div class="pill"><i></i>단축키 &rarr; 입력 &rarr; 읽기</div></div>
<div class="demo"><div class="bar"><span class="ch"><img src="../../../desktop-client/src/main/resources/io/github/phs314/quicktts/client/app-icon.png">일반</span><span class="txt">잠깐 화장실 다녀올게요<span class="caret"></span></span></div></div>
<div class="edge"></div></div></body></html>
