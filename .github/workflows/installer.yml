name: 설치 파일

# Windows 에서 설치 마법사(QuickTTS-버전.exe)가 만들어지는지 확인하고, 만든 파일을 Actions 아티팩트로 올린다.
# 클라이언트나 빌드 설정이 바뀔 때만 돌고, Actions 탭의 "Run workflow" 로 언제든 새로 만들 수 있다.
# v1.2.3 태그를 푸시하면 그 버전으로 설치 파일과 압축 파일을 만들어 GitHub Release 에 올린다. (태그에는 paths 조건이 걸리지 않는다.)
on:
  pull_request:
    paths:
      - 'apps/desktop-client/**'
      - 'gradle/**'
      - 'build-logic/**'
      - '*.gradle.kts'
      - '.github/workflows/installer.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/desktop-client/**'
      - 'gradle/**'
      - 'build-logic/**'
      - '*.gradle.kts'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Windows 설치 파일
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # jpackage 가 설치 파일을 만들 때 쓰는 WiX. README 에서 PC 에 깔라고 안내하는 것과 같은 3.14 버전을 PATH 에 넣는다.
      - name: WiX 설치
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile "$env:RUNNER_TEMP\wix.zip"
          Expand-Archive "$env:RUNNER_TEMP\wix.zip" -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # 태그로 돌 때는 태그의 버전(v1.2.3 → 1.2.3)을 설치 파일과 앱 버전으로 쓴다.
      - name: 버전 정하기
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=태그 모양이 틀림::태그는 v1.2.3 처럼 v 와 숫자 세 개여야 합니다: $GITHUB_REF_NAME"
              exit 1
            fi
            echo "APP_VERSION_ARG=-Pversion=$version" >> "$GITHUB_ENV"
          fi

      # 실패하면 WiX 오류 줄을 주석(annotation)으로 남겨 PR 의 Checks 요약에서 바로 보이게 한다.
      - name: 설치 파일 만들기
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew :apps:desktop-client:packageInstaller $APP_VERSION_ARG -PjpackageVerbose 2>&1 | tee build-output.txt; then
            summary=$( { grep -i -E "error|LGHT|CNDL" build-output.txt || tail -n 40 build-output.txt; } | head -n 60 | tr -d '\r')
            echo "::error title=packageInstaller 실패::$(printf '%s' "$summary" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: QuickTTS-installer
          path: apps/desktop-client/build/distributions/QuickTTS-*.exe
          retention-days: 14

      - name: 압축 파일 만들기
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: ./gradlew :apps:desktop-client:packageZip $APP_VERSION_ARG

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: QuickTTS-zip
          path: apps/desktop-client/build/distributions/QuickTTS-*-windows.zip
          retention-days: 14

  release:
    name: GitHub Release 올리기
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # 태그 이름으로 Release 를 만들고, 지난 Release 이후 머지된 PR 목록을 본문에 자동으로 붙인다.
      - name: Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## 설치

          아래 **Assets** 에서 `QuickTTS-버전.exe` 를 내려받아 실행하세요. 이미 설치되어 있으면 트레이의 Exit 로 끄고 실행하면 그 자리에 새 버전이 깔립니다.
          서명하지 않은 설치 파일이라 Windows 가 "알 수 없는 게시자" 경고를 띄웁니다. "추가 정보" → "실행" 으로 넘어가면 됩니다.
          설치 없이 쓰려면 `QuickTTS-버전-windows.zip` 을 풀어서 `QuickTTS.exe` 를 실행하세요.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "QuickTTS $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
