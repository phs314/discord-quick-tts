name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: 빌드와 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # 컴파일, 단위 테스트, ArchUnit 아키텍처 규칙까지 모두 돈다.
      - run: ./gradlew build

      - name: 테스트 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  commit-messages:
    name: 커밋 메시지 컨벤션
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PR 에서는 PR 에 들어온 커밋, main 푸시에서는 이번에 새로 올라온 커밋만 검사한다.
      - name: 새 커밋 제목 검사
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            commits=$(git rev-list --no-merges "$PR_BASE..$PR_HEAD")
          elif git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            commits=$(git rev-list --no-merges "$PUSH_BEFORE..$PUSH_AFTER")
          else
            # 이전 커밋을 알 수 없으면(첫 푸시, 강제 푸시) 맨 위 커밋만 본다.
            commits=$PUSH_AFTER
          fi
          failed=0
          for commit in $commits; do
            git log -1 --format=%s "$commit" > /tmp/msg
            scripts/check-commit-msg.sh /tmp/msg || failed=1
          done
          exit $failed
