name: PR 라벨

# PR 제목의 [타입](feat, fix, refactor ...)과 같은 이름의 라벨을 Release Drafter 의 Autolabeler 로 단다.
# 타입별 규칙은 .github/release-drafter.yml 에 있고, 초안 Release 는 만들지 않는다.
# Release 노트가 이 라벨로 "새 기능 / 버그 수정 / 기타"를 나눈다 (.github/release.yml, ADR 0022).
# 코드를 받아 오지 않으므로 pull_request_target 으로 돌고, 설정은 기본 브랜치의 것을 읽는다.
on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: 타입 라벨 달기
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7
