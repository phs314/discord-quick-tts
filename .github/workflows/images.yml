name: 컨테이너 이미지

# 서버 이미지를 만들어 GitHub Container Registry(ghcr.io)에 올린다 (ADR 0058).
# - PR: 이미지가 만들어지는지만 확인하고 올리지 않는다.
# - main: ghcr.io/phs314/quicktts-<서비스>:main 과 :main-<커밋 7자리>
# - v1.2.3 태그: :1.2.3 과 :1.2 (설치 파일 Release 와 같은 버전)
# 서비스가 늘면 matrix 의 service 에 apps/ 아래 폴더 이름을 더한다.
on:
  pull_request:
    paths:
      - 'apps/bot-server/**'
      - 'libs/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.dockerignore'
      - '.github/workflows/images.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/bot-server/**'
      - 'libs/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.dockerignore'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: 이미지 (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [bot-server]
    steps:
      - uses: actions/checkout@v7

      # arm64(Oracle A1 등) 이미지도 만든다. jar 는 빌드 단계에서 한 번만 만들고 실행 이미지 단계만 에뮬레이션으로 돈다.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: ghcr.io 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그 정하기
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/quicktts-${{ matrix.service }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 만들고 올리기
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Gradle 의존성 레이어를 Actions 캐시에 남겨 다음 빌드를 줄인다.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
