spring:
  application:
    name: quick-tts-bot
  config:
    # 저장소 루트의 .env (KEY=VALUE) 를 설정으로 읽는다. 없으면 환경변수만 쓴다.
    import: optional:file:.env[.properties]

server:
  port: ${QUICKTTS_PORT:8080}

quicktts:
  discord:
    token: ${DISCORD_TOKEN:}
  api-key: ${QUICKTTS_API_KEY:}
  tts:
    # 사용할 TTS 엔진. 지금은 google-translate 하나뿐이다.
    engine: google-translate
    language: ko
